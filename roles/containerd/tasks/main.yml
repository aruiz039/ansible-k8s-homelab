---
- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
- name: Add Docker apt signing key
  ansible.builtin.get_url:
    url: '{{ containerd_apt_key_url }}'
    dest: '{{ containerd_apt_keyring }}'
    mode: '0644'
    force: true
- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
      signed-by={{ containerd_apt_keyring }}]
      {{ containerd_apt_repo_url }}
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true
- name: Install containerd
  ansible.builtin.apt:
    name: '{{ containerd_packages }}'
    state: present
- name: Ensure containerd config directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: '0755'
- name: Generate default containerd config
  ansible.builtin.shell: containerd config default > {{ containerd_config_path }}
  args:
    creates: '{{ containerd_config_path }}.generated'
  notify: Restart containerd
- name: Mark containerd config as generated
  ansible.builtin.file:
    path: '{{ containerd_config_path }}.generated'
    state: touch
    mode: '0644'
  changed_when: false
- name: Set SystemdCgroup = true in containerd config
  ansible.builtin.replace:
    path: '{{ containerd_config_path }}'
    regexp: (\s+)SystemdCgroup\s*=\s*false
    replace: \1SystemdCgroup = true
  notify: Restart containerd
  when: containerd_systemd_cgroup | bool
- name: Ensure CRI plugin is not disabled
  ansible.builtin.lineinfile:
    path: '{{ containerd_config_path }}'
    regexp: ^disabled_plugins\s*=
    line: disabled_plugins = []
    state: present
  notify: Restart containerd
- name: Ensure containerd is enabled and started
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
