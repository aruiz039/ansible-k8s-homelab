---
- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
- name: Download Kubernetes apt signing key
  ansible.builtin.get_url:
    url: '{{ kubernetes_apt_repo_base }}/v{{ kubernetes_version }}/deb/Release.key'
    dest: /tmp/kubernetes-release.key
    mode: '0644'
    force: true
- name: Convert Kubernetes apt key to keyring format
  ansible.builtin.shell: |
    gpg --dearmor --yes -o {{ kubernetes_apt_keyring }} /tmp/kubernetes-release.key
  args:
    creates: '{{ kubernetes_apt_keyring }}'
- name: Add Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ kubernetes_apt_keyring }}]
      {{ kubernetes_apt_repo_base }}/v{{ kubernetes_version }}/deb/ /
    filename: kubernetes
    state: present
    update_cache: true
- name: Install Kubernetes packages at pinned version
  ansible.builtin.apt:
    name: "{{ kubernetes_packages | map('regex_replace', '^(.*)$', '\\1=' + kubernetes_package_version) | list }}"
    state: present
    allow_change_held_packages: true
- name: Hold Kubernetes packages at pinned version
  ansible.builtin.dpkg_selections:
    name: '{{ item }}'
    selection: hold
  loop: '{{ kubernetes_packages }}'
- name: Ensure kubelet is enabled
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
