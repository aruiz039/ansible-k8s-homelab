---
# ============================================================
# PLAY 1: Upgrade kubeadm on the control plane
# ============================================================
- name: Upgrade control plane kubeadm
  hosts: control_plane
  become: yes
  serial: 1

  tasks:
    - name: Update Kubernetes apt repository to target minor version
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by={{ kubernetes_apt_keyring }}]
          {{ kubernetes_apt_repo_base }}/v{{ kubernetes_version }}/deb/ /
        filename: kubernetes
        state: present
        update_cache: yes

    - name: Unhold Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: install
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Upgrade kubeadm
      ansible.builtin.apt:
        name: "kubeadm={{ kubernetes_package_version }}"
        state: present
        allow_change_held_packages: yes

    - name: Plan the upgrade
      ansible.builtin.command: kubeadm upgrade plan
      register: upgrade_plan
      changed_when: false

    - name: Show upgrade plan
      ansible.builtin.debug:
        var: upgrade_plan.stdout_lines

    - name: Apply the upgrade on first control plane node
      ansible.builtin.command: >-
        kubeadm upgrade apply -y v{{ kubernetes_package_version.split('-')[0] }}

    - name: Drain the control plane node
      ansible.builtin.command: >-
        kubectl drain {{ inventory_hostname }}
        --ignore-daemonsets --delete-emptydir-data --force --timeout=5m
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Upgrade kubelet and kubectl
      ansible.builtin.apt:
        name:
          - "kubelet={{ kubernetes_package_version }}"
          - "kubectl={{ kubernetes_package_version }}"
        state: present
        allow_change_held_packages: yes

    - name: Restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
        daemon_reload: yes

    - name: Wait for control plane node to become Ready
      ansible.builtin.shell: |
        kubectl --kubeconfig=/etc/kubernetes/admin.conf get node {{ inventory_hostname }} \
          -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      register: cp_node_ready
      changed_when: false
      check_mode: false
      until: cp_node_ready.stdout == "True"
      retries: 30
      delay: 10

    - name: Uncordon the control plane node
      ansible.builtin.command: kubectl uncordon {{ inventory_hostname }}
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Re-hold Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

# ============================================================
# PLAY 2: Upgrade workers one at a time
# ============================================================
- name: Upgrade worker nodes
  hosts: workers
  become: yes
  serial: 1

  tasks:
    - name: Update Kubernetes apt repository to target minor version
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by={{ kubernetes_apt_keyring }}]
          {{ kubernetes_apt_repo_base }}/v{{ kubernetes_version }}/deb/ /
        filename: kubernetes
        state: present
        update_cache: yes

    - name: Unhold Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: install
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Upgrade kubeadm on worker
      ansible.builtin.apt:
        name: "kubeadm={{ kubernetes_package_version }}"
        state: present
        allow_change_held_packages: yes

    - name: Run kubeadm upgrade node on worker
      ansible.builtin.command: kubeadm upgrade node

    - name: Drain the worker node
      ansible.builtin.command: >-
        kubectl drain {{ inventory_hostname }}
        --ignore-daemonsets --delete-emptydir-data --force --timeout=5m
      delegate_to: "{{ groups['control_plane'][0] }}"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Upgrade kubelet and kubectl
      ansible.builtin.apt:
        name:
          - "kubelet={{ kubernetes_package_version }}"
          - "kubectl={{ kubernetes_package_version }}"
        state: present
        allow_change_held_packages: yes

    - name: Restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
        daemon_reload: yes

    - name: Wait for node to become Ready
      ansible.builtin.shell: |
        kubectl --kubeconfig=/etc/kubernetes/admin.conf get node {{ inventory_hostname }} \
          -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      delegate_to: "{{ groups['control_plane'][0] }}"
      register: node_ready
      changed_when: false
      check_mode: false
      until: node_ready.stdout == "True"
      retries: 30
      delay: 10

    - name: Uncordon the worker
      ansible.builtin.command: kubectl uncordon {{ inventory_hostname }}
      delegate_to: "{{ groups['control_plane'][0] }}"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Re-hold Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl