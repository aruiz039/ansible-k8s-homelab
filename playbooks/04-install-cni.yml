---
- name: Install cluster networking and ingress
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: '{{ playbook_dir }}/../.venv/bin/python'
  environment:
    KUBECONFIG: '{{ kubeconfig_path }}'
  tasks:
    # ============================================================
    # CILIUM (CNI)
    # ============================================================
    - name: Add Cilium Helm repository
      kubernetes.core.helm_repository:
        name: cilium
        repo_url: https://helm.cilium.io/
    - name: Install Cilium
      kubernetes.core.helm:
        name: cilium
        chart_ref: cilium/cilium
        chart_version: '{{ cilium_version }}'
        release_namespace: kube-system
        kubeconfig: '{{ kubeconfig_path }}'
        wait: true
        wait_timeout: 10m
        values:
          ipam:
            mode: kubernetes
          kubeProxyReplacement: false
          operator:
            replicas: 1
            tolerations:
              - operator: Exists
                effect: NoSchedule
              - key: node.kubernetes.io/not-ready
                operator: Exists
                effect: NoSchedule
          # Allow Cilium agent pods to schedule before nodes are Ready
          tolerations:
            - operator: Exists
    - name: Wait for all nodes to become Ready
      ansible.builtin.shell: |
        kubectl --kubeconfig={{ kubeconfig_path }} get nodes \
          -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}'
      register: node_ready_check
      changed_when: false
      until: >-
        node_ready_check.stdout_lines | length > 0 and
        node_ready_check.stdout_lines | reject('equalto', 'True') | list | length
        == 0
      retries: 60
      delay: 10

    # ============================================================
    # METALLB (LoadBalancer implementation)
    # ============================================================
    - name: Add MetalLB Helm repository
      kubernetes.core.helm_repository:
        name: metallb
        repo_url: https://metallb.github.io/metallb
    - name: Create metallb-system namespace
      kubernetes.core.k8s:
        state: present
        kubeconfig: '{{ kubeconfig_path }}'
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: metallb-system
            labels:
              pod-security.kubernetes.io/enforce: privileged
    - name: Install MetalLB
      kubernetes.core.helm:
        name: metallb
        chart_ref: metallb/metallb
        chart_version: '{{ metallb_version }}'
        release_namespace: metallb-system
        kubeconfig: '{{ kubeconfig_path }}'
        wait: true
        wait_timeout: 5m
    - name: Wait for MetalLB CRDs to be established
      ansible.builtin.shell: |
        kubectl --kubeconfig={{ kubeconfig_path }} get crd ipaddresspools.metallb.io \
          -o jsonpath='{.status.conditions[?(@.type=="Established")].status}'
      register: metallb_crd_check
      changed_when: false
      failed_when: false
      until: metallb_crd_check.stdout == "True"
      retries: 30
      delay: 5
    - name: Wait for MetalLB controller to be ready
      ansible.builtin.shell: |
        kubectl --kubeconfig={{ kubeconfig_path }} -n metallb-system \
          get deployment metallb-controller \
          -o jsonpath='{.status.readyReplicas}'
      register: metallb_ready_check
      changed_when: false
      failed_when: false
      until: metallb_ready_check.stdout | default('0') | int > 0
      retries: 30
      delay: 5
    - name: Configure MetalLB IPAddressPool
      kubernetes.core.k8s:
        state: present
        kubeconfig: '{{ kubeconfig_path }}'
        definition:
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: lab-pool
            namespace: metallb-system
          spec:
            addresses: ['{{ metallb_ip_range }}']
    - name: Configure MetalLB L2 advertisement
      kubernetes.core.k8s:
        state: present
        kubeconfig: '{{ kubeconfig_path }}'
        definition:
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: lab-l2
            namespace: metallb-system
          spec:
            ipAddressPools:
              - lab-pool

    # ============================================================
    # INGRESS-NGINX
    # ============================================================
    - name: Add ingress-nginx Helm repository
      kubernetes.core.helm_repository:
        name: ingress-nginx
        repo_url: https://kubernetes.github.io/ingress-nginx
    - name: Install ingress-nginx
      kubernetes.core.helm:
        name: ingress-nginx
        chart_ref: ingress-nginx/ingress-nginx
        chart_version: '{{ ingress_nginx_version }}'
        release_namespace: ingress-nginx
        create_namespace: true
        kubeconfig: '{{ kubeconfig_path }}'
        wait: true
        wait_timeout: 5m
        values:
          controller:
            service:
              type: LoadBalancer
            ingressClassResource:
              default: true
    - name: Wait for ingress-nginx LoadBalancer to get an IP
      ansible.builtin.shell: |
        kubectl --kubeconfig={{ kubeconfig_path }} -n ingress-nginx \
          get service ingress-nginx-controller \
          -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
      register: ingress_ip_check
      changed_when: false
      failed_when: false
      until: ingress_ip_check.stdout | length > 0
      retries: 30
      delay: 5
    - name: Display ingress IP
      ansible.builtin.debug:
        msg: 'Ingress is reachable at: {{ ingress_ip_check.stdout }}'
